services:
  echoservice-redis:
    image: redis:7-alpine
    container_name: echoservice-redis
    ports:
      - "6379:6379"
    networks:
      - echoservice
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    command: redis-server --save ""
  echoservice-mock-server:
    container_name: echoservice-mock-server
    build:
      context: ./mock-echolalia
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    networks:
      - echoservice
    environment:
      - EXPECTED_CLIENT_ID=${CLIENT_ID}
      - EXPECTED_CLIENT_SECRET=${CLIENT_SECRET}
      - FLASK_PORT=${FLASK_PORT}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - ./mock-echolalia/src:/app/src
      - ./mock-echolalia/database_1.yml:/app/database_1.yml
  echoservice-daemon:
    container_name: echoservice-daemon
    build:
      context: ./daemon
      dockerfile: Dockerfile.dev
    depends_on:
      - echoservice-redis
      - echoservice-mock-server
    networks:
      - echoservice
      - echoservice-external
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - BASE_URL=${BASE_URL}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - ${ECHOLALIA_FOLDER}:/app/echolalia
      - ./daemon/src:/app/src
  echoservice-vtc-worker:
    container_name: echoservice-vtc-worker
    build:
      context: ./vtc-worker
      dockerfile: Dockerfile.dev
      network: host # I need this for Conda installation
    depends_on:
      - echoservice-redis
    networks:
      - echoservice
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ECHOLALIA_DIR=/app/echolalia
      - DATASETS_DIR=/app/datasets
      - VTC_FOLDER=/app/voice_type_classifier
      - VTC_DEVICE=${VTC_DEVICE}
      - CONDA_ENV_NAME=pyannote
      - CONDA_ACTIVATE_FILE=/opt/conda/bin/activate
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - ${DATASETS_FOLDER}:/app/datasets
      - ${ECHOLALIA_FOLDER}:/app/echolalia
      - ./vtc-worker/src:/app/src
  echoservice-vtc-2-worker:
    container_name: echoservice-vtc-2-worker
    build:
      context: ./vtc-2-worker
      dockerfile: Dockerfile.dev
      network: host
    depends_on:
      - echoservice-redis
    networks:
      - echoservice
      - echoservice-external
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ECHOLALIA_DIR=/app/echolalia
      - DATASETS_DIR=/app/datasets
      - VTC_2_FOLDER=/app/VTC
      - VTC_2_DEVICE=${VTC_2_DEVICE}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - ${DATASETS_FOLDER}:/app/datasets
      - ${ECHOLALIA_FOLDER}:/app/echolalia
      - ./vtc-2-worker/src:/app/src
  echoservice-alice-worker:
    container_name: echoservice-alice-worker
    build:
      context: ./alice-worker
      dockerfile: Dockerfile.dev
      network: host # Needed for conda installation
    depends_on:
      - echoservice-redis
    networks:
      - echoservice
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ECHOLALIA_DIR=/app/echolalia
      - DATASETS_DIR=/app/datasets
      - ALICE_FOLDER=/app/ALICE
      - ALICE_DEVICE=${ALICE_DEVICE}
      - CONDA_ENV_NAME=ALICE
      - CONDA_ACTIVATE_FILE=/opt/conda/bin/activate
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - ${DATASETS_FOLDER}:/app/datasets
      - ${ECHOLALIA_FOLDER}:/app/echolalia
      - ./alice-worker/src:/app/src
  echoservice-acoustics-worker:
    container_name: echoservice-acoustics-worker
    build:
      context: ./acoustics-worker
      dockerfile: Dockerfile.dev
      network: host
    depends_on:
      - echoservice-redis
    networks:
      - echoservice
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ECHOLALIA_DIR=/app/echolalia
      - DATASETS_DIR=/app/datasets
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - ${DATASETS_FOLDER}:/app/datasets
      - ${ECHOLALIA_FOLDER}:/app/echolalia
      - ./acoustics-worker/src:/app/src
  echoservice-w2v2-worker:
    container_name: echoservice-w2v2-worker
    build:
      context: ./w2v2-worker
      dockerfile: Dockerfile.dev
      network: host
    depends_on:
      - echoservice-redis
    networks:
      - echoservice
      - echoservice-external # I'd rather not, but needs HuggingFace connection
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ECHOLALIA_DIR=/app/echolalia
      - DATASETS_DIR=/app/datasets
      - CHUNKIFY_THREADS=${W2V2_CHUNKIFY_THREADS}
      - W2V2_FOLDER=/app/speech-maturity
      - W2V2_DEVICE=${W2V2_DEVICE}
      - NUM_WORKERS=${W2V2_NUM_WORKERS}
      - BATCH_SIZE=${W2V2_BATCH_SIZE}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - ${DATASETS_FOLDER}:/app/datasets
      - ${ECHOLALIA_FOLDER}:/app/echolalia
      - ./w2v2-worker/src:/app/src
      - ./w2v2-worker/src/infer.py:/app/speech-maturity/scripts/infer.py
  echoservice-e2e:
    container_name: echoservice-e2e
    build:
      context: ./tests
      dockerfile: Dockerfile.dev
    depends_on:
      - echoservice-redis
      - echoservice-daemon
    networks:
      - echoservice
    environment:
      - EXPECTED_CLIENT_ID=${CLIENT_ID}
      - EXPECTED_CLIENT_SECRET=${CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
      - ./tests/tests:/app/tests
  echoservice-loki:
    container_name: echoservice-loki
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - echoservice
      - echoservice-external
  echoservice-promtail:
    container_name: echoservice-promtail
    image: grafana/promtail:2.9.0
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.dev.yml
    ports:
      - "9080:9080"
    networks:
      - echoservice
      - echoservice-external
  echoservice-grafana:
    container_name: echoservice-grafana
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - echoservice
      - echoservice-external
  echoservice-netdata:
    image: netdata/netdata:v2.10.2
    container_name: echoservice-netdata
    ports:
      - "19999:19999"
    volumes:
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    networks:
      - echoservice
      - echoservice-external
volumes:
  loki-data:
  grafana-data:
  uptime-kuma-data:
networks:
  echoservice:
    driver: bridge
    internal: true
  echoservice-external:
    external: true
