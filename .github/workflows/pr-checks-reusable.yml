name: PR Checks (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: ''
      docker-context:
        required: false
        type: string
        default: ''

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: "3.13"
    - name: Install tox
      run: python -m pip install tox
    - name: Run linting checks
      run: tox -e lint
      working-directory: ${{ inputs.working-directory }}
    - name: Run formatting checks
      run: tox -e format
      working-directory: ${{ inputs.working-directory }}
    - name: Run type checks
      run: tox -e typecheck
      working-directory: ${{ inputs.working-directory }}

  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python:
        - version: "3.13"
          toxenv: "py313"

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: ${{ matrix.python.version }}
    - name: Install tox
      run: python -m pip install tox
    - name: Install Redis
      run: |
        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          sudo apt-get update
          sudo apt-get install -y redis-server
        elif [ "${{ matrix.os }}" == "macos-latest" ]; then
          brew install redis
        fi
    - name: Run unit tests
      run: |
        if [ -d "tests/unit" ]; then
          tox -e ${{ matrix.python.toxenv }} -- tests/unit --randomly-seed=$RANDOM
        else
          echo "No unit tests found, skipping."
        fi
      working-directory: ${{ inputs.working-directory }}
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
    - name: Run integration tests
      run: |
        if [ -d "tests/integration" ]; then
          tox -e ${{ matrix.python.toxenv }} -- tests/integration --randomly-seed=$RANDOM
        else
          echo "No integration tests found, skipping."
        fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: inputs.dockerfile != ''

    steps:
    - uses: actions/checkout@v3
    - uses: docker/setup-buildx-action@v3
      with:
        install: true
    - name: Pre-build worker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.docker-context || inputs.working-directory }}
        file: ${{ inputs.dockerfile }}
        push: false
        load: true
        tags: analysis-service-e2e:cache
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: "3.13"
    - name: Install tox
      run: python -m pip install tox
    - name: Run E2E tests
      run: tox -e e2e -- --randomly-seed=$RANDOM
      working-directory: ${{ inputs.working-directory }}
