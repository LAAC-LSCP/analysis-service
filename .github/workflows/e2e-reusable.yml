name: E2E Tests (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      dockerfile:
        required: true
        type: string

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: docker/setup-buildx-action@v3
      with:
        install: true
    - name: Pre-build worker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.working-directory }}
        file: ${{ inputs.dockerfile }}
        push: false
        load: true
        tags: analysis-service-e2e:cache
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: "3.13"
    - name: Install tox
      run: python -m pip install tox
    - name: Run E2E tests
      run: tox -e e2e -- --randomly-seed=$RANDOM
      working-directory: ${{ inputs.working-directory }}
